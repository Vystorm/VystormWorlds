# /worlds through Vystorm Core: description, help and tab completion per player. "aliases" under commands.worlds are
# extra root commands (server-wide, the admin chooses which languages: Core config commands.localized-aliases); "name"
# and "aliases" of a subcommand are accepted in every language, English always works. "values" are the keywords of
# link, regen and clone.
commands:
  worlds:
    description: "Multiworld: world selector, teleports and world management"
    aliases: []
    usage: "[WORLD]"
    sub:
      menu:
        name: menu
        aliases: []
        description: "Open the world selector"
      tp:
        name: tp
        aliases: []
        description: "Travel to a world (admins: send a player there)"
        usage: "WORLD [PLAYER]"
      spawn:
        name: spawn
        aliases: []
        description: "Go to the spawn of the world you are in"
      arrival:
        name: arrival
        aliases: []
        description: "Choose spawn or last position for world travel"
        usage: "spawn|last"
      favorite:
        name: favorite
        aliases: []
        description: "Toggle a bookmark for a visible world"
        usage: "[WORLD]"
      favorites:
        name: favorites
        aliases: []
        description: "Open your favorite worlds"
      admin:
        name: admin
        aliases: []
        description: "Open the world admin menu"
      list:
        name: list
        aliases: []
        description: "All worlds with state, players and TPS"
      info:
        name: info
        aliases: []
        description: "Settings and state of a world"
        usage: "[WORLD]"
      groups:
        name: groups
        aliases: []
        description: "World groups and what they keep separate"
      create:
        name: create
        aliases: []
        description: "Create a world (no name: open the create dialog)"
        usage: "[NAME] [TYPE] [seed:SEED] [generator:PLUGIN:ID] [group:GROUP] [with-nether] [with-end] ..."
      import:
        name: import
        aliases: []
        description: "Import a world folder (no name: list the folders)"
        usage: "[FOLDER] [TYPE] [seed:SEED] [generator:PLUGIN:ID] [group:GROUP] ..."
      load:
        name: load
        aliases: []
        description: "Load a registered world"
        usage: "WORLD"
      unload:
        name: unload
        aliases: []
        description: "Unload a world"
        usage: "WORLD"
      delete:
        name: delete
        aliases: []
        description: "Delete a world (with backup, asks for the name)"
        usage: "WORLD"
      regen:
        name: regen
        aliases: []
        description: "Regenerate a world with the same, a random or a new seed"
        usage: "WORLD [same|random|SEED]"
      clone:
        name: clone
        aliases: []
        description: "Copy a world under a new name"
        usage: "WORLD NEW-NAME [confirm]"
      set:
        name: set
        aliases: []
        description: "Change a world property"
        usage: "WORLD PROPERTY VALUE"
      edit:
        name: edit
        aliases: []
        description: "Open the world menu"
        usage: "[WORLD]"
      settings:
        name: settings
        aliases: []
        description: "Open the settings dialog of a world"
        usage: "[WORLD]"
      setspawn:
        name: setspawn
        aliases: []
        description: "Set the world spawn where you stand"
      link:
        name: link
        aliases: []
        description: "Link the nether or end portals of a world to another world"
        usage: "WORLD nether|end TARGET|none"
      generators:
        name: generators
        aliases: []
        description: "Installed world generators and presets"
      template:
        name: template
        aliases: []
        description: "Manage reusable visit-world templates"
      visit:
        name: visit
        aliases: []
        description: "Visit a template world or list available templates"
      leave:
        name: leave
        aliases: []
        description: "Leave your template visit safely"
      reload:
        name: reload
        aliases: []
        description: "Reload config, worlds.yml and language files"
    values:
      spawn: spawn
      last: last
      confirm: confirm
      nether: nether
      end: end
      same: same
      random: random
      none: none

