# 通过 Vystorm Core 提供的 /worlds：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.worlds 下的 "aliases" 是额外的
# 主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和 "aliases"
# 在所有语言中都可使用，英文始终有效。"values" 是 link、regen 和 clone 的关键词。
commands:
  worlds:
    description: "多世界：世界选择、传送和世界管理"
    aliases: [世界]
    usage: "[世界]"
    sub:
      menu:
        name: 菜单
        aliases: []
        description: "打开世界选择器"
      tp:
        name: 传送
        aliases: []
        description: "前往一个世界（管理员：把玩家送过去）"
        usage: "世界 [玩家]"
      spawn:
        name: 出生点
        aliases: []
        description: "前往你所在世界的出生点"
      arrival:
        name: 抵达
        aliases: []
        description: "选择世界旅行时前往出生点或上次位置"
        usage: "出生点|上次"
      favorite:
        name: 收藏
        aliases: []
        description: "添加或移除可见世界的收藏"
        usage: "[WORLD]"
      favorites:
        name: 收藏夹
        aliases: []
        description: "打开收藏的世界"
      admin:
        name: 管理
        aliases: []
        description: "打开世界管理菜单"
      list:
        name: 列表
        aliases: []
        description: "所有世界及其状态、玩家和 TPS"
      info:
        name: 信息
        aliases: []
        description: "一个世界的设置和状态"
        usage: "[世界]"
      groups:
        name: 分组
        aliases: []
        description: "世界分组及其分开保存的内容"
      create:
        name: 创建
        aliases: []
        description: "创建世界（不填名称：打开创建对话框）"
        usage: "[名称] [类型] [seed:种子] [generator:插件:ID] [group:分组] [with-nether] [with-end] ..."
      import:
        name: 导入
        aliases: []
        description: "导入世界文件夹（不填名称：列出文件夹）"
        usage: "[文件夹] [类型] [seed:种子] [generator:插件:ID] [group:分组] ..."
      load:
        name: 加载
        aliases: []
        description: "加载已登记的世界"
        usage: "世界"
      unload:
        name: 卸载
        aliases: []
        description: "卸载一个世界"
        usage: "世界"
      delete:
        name: 删除
        aliases: []
        description: "删除世界（会备份，需要输入名称确认）"
        usage: "世界"
      regen:
        name: 重新生成
        aliases: []
        description: "用相同、随机或新的种子重新生成世界"
        usage: "世界 [相同|随机|种子]"
      clone:
        name: 复制
        aliases: []
        description: "以新名称复制一个世界"
        usage: "世界 新名称 [确认]"
      set:
        name: 属性
        aliases: []
        description: "修改一个世界属性"
        usage: "世界 属性 值"
      edit:
        name: 编辑
        aliases: []
        description: "打开世界菜单"
        usage: "[世界]"
      settings:
        name: 设置
        aliases: []
        description: "打开世界的设置对话框"
        usage: "[世界]"
      setspawn:
        name: 设出生点
        aliases: []
        description: "把世界出生点设在你站的位置"
      link:
        name: 链接
        aliases: []
        description: "把世界的下界或末地传送门连接到另一个世界"
        usage: "世界 下界|末地 目标|无"
      generators:
        name: 生成器
        aliases: []
        description: "已安装的世界生成器和预设"
      template:
        name: 模板
        aliases: []
        description: "管理可重复使用的访问世界模板"
      visit:
        name: 访问
        aliases: []
        description: "访问模板世界或列出可用模板"
      leave:
        name: 离开
        aliases: []
        description: "安全结束模板世界访问"
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置、worlds.yml 和语言文件"
    values:
      spawn: 出生点
      last: 上次
      confirm: 确认
      nether: 下界
      end: 末地
      same: 相同
      random: 随机
      none: 无

