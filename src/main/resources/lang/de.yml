# /worlds über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" unter commands.worlds
# sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig commands.localized-aliases);
# "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer. "values" sind die
# Schlüsselwörter von link, regen und clone.
commands:
  worlds:
    description: "Mehrere Welten: Weltauswahl, Teleports und Weltverwaltung"
    aliases: [welten]
    usage: "[WELT]"
    sub:
      menu:
        name: menü
        aliases: [menue]
        description: "Weltauswahl öffnen"
      tp:
        name: reise
