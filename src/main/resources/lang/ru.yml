commands:
  worlds:
    description: 'Multiworld: мировой селектор, телепорт и управление миром'
    aliases: []
    usage: '[WORLD]'
    sub:
      menu:
        name: menu
        aliases: []
        description: Открыть мировой селектор
      tp:
        name: tp
        aliases: []
        description: 'Путешествие в мир (admins: send a player there)'
        usage: WORLD [PLAYER]
      spawn:
        name: spawn
        aliases: []
        description: Отправляйтесь в мир, в котором вы находитесь
      arrival:
        name: arrival
        aliases: []
        description: Выберите появление или последнюю позицию для путешествий по миру
        usage: появление |last
      favorite:
        name: favorite
        aliases: []
        description: Переключите закладку для видимого мира
        usage: '[WORLD]'
      favorites:
        name: favorites
        aliases: []
        description: Откройте свои любимые миры
      admin:
        name: admin
        aliases: []
        description: Откройте меню World Admin
      list:
        name: list
        aliases: []
        description: Все миры с государством, игроками и TPS
      info:
        name: info
        aliases: []
        description: Положение и состояние мира
        usage: '[WORLD]'
      groups:
        name: groups
        aliases: []
        description: Мировые группы и то, что они держат отдельно
      create:
        name: create
        aliases: []
        description: 'Создайте мир (без названия: откройте диалог создания)'
        usage: '[NAME] [TYPE] [seed:SEED] [generator:PLUGIN:ID] [group:GROUP] [with-nether] [with-end] ...'
      import:
        name: import
        aliases: []
        description: 'Импорт мировой папки (без названия: список папок)'
        usage: '[FOLDER] [TYPE] [seed:SEED] [generator:PLUGIN:ID] [group:GROUP] ...'
      load:
        name: load
        aliases: []
        description: Загрузить зарегистрированный мир
        usage: WORLD
      unload:
        name: unload
        aliases: []
        description: Скачать The World
        usage: WORLD
      delete:
        name: delete
        aliases: []
        description: Удалить мир (с резервной копией, просит имя)
        usage: WORLD
      regen:
        name: regen
        aliases: []
        description: Восстановление мира с тем же, случайным или новым семенем
        usage: WORLD [same|random|SEED]
      clone:
        name: clone
        aliases: []
        description: Копировать мир под новым именем
        usage: WORLD NEW-NAME [confirm]
      set:
        name: set
        aliases: []
        description: Изменить мировую собственность
        usage: WORLD PROPERTY VALUE
      edit:
        name: edit
        aliases: []
        description: Откройте мировое меню
        usage: '[WORLD]'
      settings:
        name: settings
        aliases: []
        description: Откройте диалог настроек мира
        usage: '[WORLD]'
      setspawn:
        name: setspawn
        aliases: []
        description: Создайте мир, где вы стоите
      link:
        name: link
        aliases: []
        description: Связать нижние или конечные порталы мира с другим миром
        usage: WORLD nether |end TARGET |none
      generators:
        name: generators
        aliases: []
        description: Установленные мировые генераторы и предустановки
      template:
        name: template
        aliases: []
        description: "Управление шаблонами миров для посещения"
      visit:
        name: visit
        aliases: []
        description: "Посетить шаблон или показать доступные шаблоны"
      leave:
        name: leave
        aliases: []
        description: "Безопасно завершить посещение"
      reload:
        name: reload
        aliases: []
        description: Перезагрузка конфигураций, worlds.yml и языковых файлов
    values:
      spawn: появление
      last: последний
      confirm: подтвердить
      nether: нить
      end: конец
      same: то же самое
      random: случайный
      none: нет
