title: 'Миры'
pages:
  - title: 'Путешествия между мирами'
    text: |
      /worlds открывает выбор миров. Выберите мир для перемещения; /worlds spawn — к точке появления.
  - title: 'Избранное и прибытие'
    text: |
      Добавляйте миры в избранное и выбирайте прибытие на спавн или на прошлую позицию.
      Введите /worlds help, чтобы увидеть все команды.
